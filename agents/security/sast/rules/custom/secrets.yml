rules:

  # ---------------------------------------------------------------------------
  # SECRETS: AWS Credentials
  # ---------------------------------------------------------------------------

  - id: aws-access-key-id
    patterns:
      - pattern-regex: AKIA[0-9A-Z]{16}
    message: >
      AWS Access Key ID found in source code. Revoke this key immediately and
      rotate it. Store AWS credentials in environment variables, AWS IAM roles,
      or a secrets manager — never in source code.
    languages: [generic]
    severity: CRITICAL
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # SECRETS: Private Keys
  # ---------------------------------------------------------------------------

  - id: private-key-pem
    patterns:
      - pattern-regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    message: >
      PEM private key found in source code. Remove immediately and regenerate
      the key pair. Private keys must be stored in a secrets manager or hardware
      security module, not in version control.
    languages: [generic]
    severity: CRITICAL
    metadata:
      cwe: ["CWE-321: Hard-coded Cryptographic Key"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # SECRETS: Generic High-Entropy Passwords
  # ---------------------------------------------------------------------------

  - id: generic-hardcoded-api-key
    patterns:
      - pattern-regex: (?i)(api[_-]?key|apikey|access[_-]?token|auth[_-]?token)\s*[=:]\s*['"][A-Za-z0-9+/]{20,}['"]
    message: >
      Hardcoded API key or token detected. Rotate this credential immediately.
      Use environment variables or a secrets manager to inject credentials at runtime.
    languages: [generic]
    severity: HIGH
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM

  - id: generic-hardcoded-password
    patterns:
      - pattern-regex: (?i)(password|passwd|pwd)\s*[=:]\s*['"][^'"]{8,}['"]
    message: >
      Hardcoded password detected. Remove from source code and load from an
      environment variable or secrets manager instead.
    languages: [generic]
    severity: HIGH
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # SECRETS: Database Connection Strings
  # ---------------------------------------------------------------------------

  - id: db-connection-string-with-password
    patterns:
      - pattern-regex: (?i)(jdbc|mongodb|postgres|mysql|mssql|redis)://[^:]+:[^@]{4,}@
    message: >
      Database connection string with embedded credentials found. Move the
      password to an environment variable: DB_URL=jdbc://user:${DB_PASSWORD}@host/db
    languages: [generic]
    severity: HIGH
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # SECRETS: GitHub / GitLab Tokens
  # ---------------------------------------------------------------------------

  - id: github-token
    patterns:
      - pattern-regex: ghp_[A-Za-z0-9]{36}
    message: >
      GitHub Personal Access Token found. Revoke at github.com/settings/tokens
      and remove from source code immediately.
    languages: [generic]
    severity: CRITICAL
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH

  - id: gitlab-token
    patterns:
      - pattern-regex: glpat-[A-Za-z0-9\-]{20}
    message: >
      GitLab Personal Access Token found in source code. Revoke and rotate immediately.
    languages: [generic]
    severity: CRITICAL
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
